name: Update Runner Lab EOD Feed
on:
  workflow_dispatch:
  schedule:
    # UTC Tue-Sat = previous US trading session after 20:00 ET (DST-safe)
    - cron: '15 1 * * 2-6'
permissions:
  contents: write
concurrency:
  group: runner-feed
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Restore historical market cache
        uses: actions/cache@v4
        with:
          path: runner-scanner/.cache
          key: runner-market-${{ github.run_id }}
          restore-keys: |
            runner-market-
      - name: Generate research feed
        env:
          MASSIVE_API_KEY: ${{ secrets.MASSIVE_API_KEY }}
        run: python runner-scanner/build_feed.py
      - name: Publish feed only on change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add runner-scanner/data/latest.json
          if ! git diff --cached --quiet; then
            git commit -m "Update runner research feed [skip ci]"
            # The repository may advance while a long market-data job is running.
            # Rebase the feed commit onto the latest master before pushing.
            for attempt in 1 2 3; do
              git fetch origin master
              git rebase origin/master
              if git push origin HEAD:master; then
                echo "Published scanner results."
                exit 0
              fi
              echo "Push raced with another commit; retrying ($attempt/3)."
              sleep 3
            done
            echo "::error::Failed to publish scanner data after three attempts."
            exit 1
          else
            echo "Feed unchanged; nothing to publish."
          fi
